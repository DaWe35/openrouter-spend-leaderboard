services:
  web:
    image: busybox:1.37
    # Static file server for public/. Refresh data with `npm run fetch` on the host;
    # the folder is mounted, so new data shows up on page reload.
    command: httpd -f -v -p 8080 -h /www
    ports:
      - "8080:8080"
    volumes:
      - ./public:/www:ro
    restart: unless-stopped
